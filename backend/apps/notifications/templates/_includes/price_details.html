<tr>
  <td style="padding:8px 24px 24px 24px;">
    <h3 style="margin:0 0 12px 0;color:#1a1a1a;font-size:16px;font-weight:600;">Price details</h3>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;background-color:#fafafa;border-radius:6px;">
      <tr>
        <td style="padding:12px 14px;color:#555;font-size:14px;">{{ nights }} night{{ nights|pluralize }} × ₹{{ per_night_amount }}</td>
        <td style="padding:12px 14px;color:#555;font-size:14px;text-align:right;">₹{{ subtotal }}</td>
      </tr>
      {% if tax_amount and tax_amount != "0" %}
      <tr>
        <td style="padding:0 14px 12px 14px;color:#555;font-size:14px;">Goods &amp; services tax</td>
        <td style="padding:0 14px 12px 14px;color:#555;font-size:14px;text-align:right;">₹{{ tax_amount }}</td>
      </tr>
      {% endif %}
      <tr>
        <td style="padding:12px 14px;color:#1a1a1a;font-size:16px;font-weight:600;border-top:1px solid #e8e8e8;">
          Total {% block total_label %}paid{% endblock %}
        </td>
        <td style="padding:12px 14px;color:#1a1a1a;font-size:16px;font-weight:600;text-align:right;border-top:1px solid #e8e8e8;">₹{{ amount }}</td>
      </tr>
    </table>
  </td>
</tr>
