limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

upstream roombuddy_app {
    server unix:/run/roombuddy/roombuddy.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.roombuddy.co.in;

    client_max_body_size 25M;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /static/ {
        alias /home/ubuntu/roombuddy/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /api/health/ {
        proxy_pass http://roombuddy_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ ^/api/(auth|otp)/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://roombuddy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/payments/webhook/ {
        proxy_pass http://roombuddy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://roombuddy_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}